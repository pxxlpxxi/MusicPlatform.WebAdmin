<div class="dropdown"
     id="languageDropdown">

    <button type="button"
            class="dropdown-toggle"
            id="languageButton"
            aria-haspopup="true"
            aria-expanded="false">

        <img id="currentFlag"
             src="/images/flag-da.svg"
             alt="" />

        <span id="currentLanguageText">
            Dansk
        </span>

        &#9662;

    </button>


    <ul class="dropdown-menu"
        id="languageMenu"
        hidden>

        <li>

            <button type="button"
                    data-language="da">

                <img src="/images/flag-da.svg"
                     alt="" />

                Dansk

            </button>

        </li>


        <li>

            <button type="button"
                    data-language="en">

                <img src="/images/flag-en.svg"
                     alt="" />

                English

            </button>

        </li>

    </ul>

</div>
